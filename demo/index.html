<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>canvas-text demo</title>
<style>
* { margin: 0; padding: 0; box-sizing: border-box; }
body { background: #1e1e1e; color: #ccc; font-family: system-ui, sans-serif; }
#canvas { display: block; width: 100%; height: 100vh; }
#info { position: fixed; top: 8px; right: 8px; font-size: 12px; color: #888; text-align: right; pointer-events: none; }
#copy { position: fixed; bottom: 12px; right: 12px; padding: 6px 14px; font-size: 13px; background: #333; color: #ccc; border: 1px solid #555; border-radius: 4px; cursor: pointer; }
#copy:hover { background: #444; }
</style>
</head>
<body>
<canvas id="canvas"></canvas>
<div id="info"></div>
<button id="copy">Copy</button>
<script type="module" src="./main.js"></script>
</body>
</html>
